<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Journal</title>
    <style>
        /* Theme Variables */
        :root {
            /* Light Theme */
            --bg-color: #f5f7fa;
            --text-color: #333;
            --heading-color: #2c3e50;
            --card-bg: white;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            --card-hover-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
            --form-bg: white;
            --form-border: #e0e0e0;
            --accent-color: #3498db;
            --accent-hover: #2980b9;
            --delete-btn: #e74c3c;
            --delete-hover: #c0392b;
            --border-color: #eee;
            --timestamp-color: #95a5a6;
            --text-secondary: #555;
            --focus-shadow: rgba(52, 152, 219, 0.1);
            --toggle-bg: #3498db;
            --toggle-bg-off: #ddd;
            --toggle-circle: white;
            --sidebar-bg: rgba(255, 255, 255, 0.8);
            --search-highlight: #ffeb3b;
            --search-highlight-bg: rgba(255, 235, 59, 0.2);
        }

        /* Dark Theme */
        [data-theme="dark"] {
            --bg-color: #1a1a2e;
            --text-color: #f0f0f0;
            --heading-color: #e0e0e0;
            --card-bg: #242444;
            --card-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            --card-hover-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            --form-bg: #242444;
            --form-border: #454570;
            --accent-color: #4facfe;
            --accent-hover: #65b6fe;
            --delete-btn: #e74c3c;
            --delete-hover: #ff6b6b;
            --border-color: #3a3a5a;
            --timestamp-color: #a0a0c0;
            --text-secondary: #c0c0d0;
            --focus-shadow: rgba(79, 172, 254, 0.25);
            --toggle-bg: #4facfe;
            --toggle-bg-off: #454570;
            --toggle-circle: #f0f0f0;
            --sidebar-bg: rgba(36, 36, 68, 0.9);
            --search-highlight: #ffeb3b;
            --search-highlight-bg: rgba(255, 235, 59, 0.2);
        }

        /* Global Styles & Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Main layout */
        .app-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
        }

        .main-content {
            width: 100%;
        }

        /* Header Styling */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 0.75rem;
            border-bottom: 3px solid var(--accent-color);
            grid-column: 1 / -1;
        }

        h1 {
            color: var(--heading-color);
            font-weight: 700;
            font-size: 2.5rem;
            letter-spacing: -0.5px;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 30px;
        }

        .theme-toggle input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--toggle-bg-off);
            transition: 0.4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 22px;
            width: 22px;
            left: 4px;
            bottom: 4px;
            background-color: var(--toggle-circle);
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--toggle-bg);
        }

        input:checked+.slider:before {
            transform: translateX(30px);
        }

        .toggle-icon {
            position: absolute;
            top: 6px;
            font-size: 16px;
            transition: opacity 0.3s ease;
        }

        .sun {
            left: 8px;
            opacity: 0;
        }

        .moon {
            right: 8px;
            opacity: 1;
        }

        input:checked+.slider .sun {
            opacity: 1;
        }

        input:checked+.slider .moon {
            opacity: 0;
        }

        /* Form Styling */
        form.entry-form {
            background: var(--form-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: var(--card-shadow);
            margin-bottom: 2rem;
            transition: all 0.3s ease;
        }

        form.entry-form:hover {
            box-shadow: var(--card-hover-shadow);
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 0.8rem 1rem;
            margin-bottom: 1.2rem;
            border: 1px solid var(--form-border);
            border-radius: 8px;
            font-size: 1rem;
            transition: border 0.3s ease;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--focus-shadow);
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            transition: background 0.3s ease;
        }

        button:hover {
            background: var(--accent-hover);
        }

        /* Entries List Styling */
        .entries-container {
            margin-top: 2rem;
            display: grid;
            gap: 1.5rem;
        }

        .entry {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .entry:hover {
            transform: translateY(-5px);
            box-shadow: var(--card-hover-shadow);
        }

        .entry::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 5px;
            height: 100%;
            background: var(--accent-color);
        }

        .entry h3 {
            color: var(--heading-color);
            margin-bottom: 0.8rem;
            font-size: 1.3rem;
        }

        .entry p {
            margin-bottom: 1.2rem;
            color: var(--text-secondary);
            line-height: 1.7;
        }

        .entry-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
        }

        .timestamp {
            color: var(--timestamp-color);
            font-size: 0.85rem;
        }

        .delete-btn {
            background: var(--delete-btn);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.3s ease;
        }

        .delete-btn:hover {
            background: var(--delete-hover);
        }

        /* Sidebar Styling */
        .sidebar {
            position: sticky;
            top: 2rem;
            height: fit-content;
            background: var(--sidebar-bg);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(10px);
        }

        .sidebar h2 {
            color: var(--heading-color);
            margin-bottom: 1.2rem;
            font-size: 1.5rem;
        }

        .search-container {
            margin-bottom: 1.5rem;
        }

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .search-box input {
            flex: 1;
        }

        .search-btn {
            padding: 0.8rem 1rem;
        }

        .search-results {
            max-height: 300px;
            overflow-y: auto;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .search-result-item {
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.75rem;
            background: var(--card-bg);
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .search-result-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--card-hover-shadow);
        }

        .search-result-item h4 {
            color: var(--heading-color);
            margin-bottom: 0.5rem;
        }

        .search-result-content {
            color: var(--text-secondary);
            font-size: 0.9rem;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .search-highlight {
            background-color: var(--search-highlight-bg);
            color: var(--text-color);
            font-weight: bold;
            padding: 0 2px;
            border-radius: 3px;
        }

        .no-results {
            padding: 1rem;
            text-align: center;
            color: var(--text-secondary);
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .app-container {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: static;
                margin-bottom: 2rem;
                order: -1;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .entry {
                padding: 1.2rem;
            }

            .header-container {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>
<div class="app-container">
    <div class="header-container">
        <h1>My Journal</h1>
        <label class="theme-toggle">
            <input type="checkbox" id="theme-toggle">
            <span class="slider">
                    <span class="toggle-icon sun">☀️</span>
                    <span class="toggle-icon moon">🌙</span>
                </span>
        </label>
    </div>

    <div class="main-content">
        <!-- Create Form -->
        <form class="entry-form" action="/entries" method="post">
            <input type="text" name="title" placeholder="What's on your mind today?" required>
            <textarea name="content" placeholder="Write your thoughts here..." rows="4" required></textarea>
            <button type="submit">Add Entry</button>
        </form>

        <!-- Entries List -->
        <div class="entries-container">
            {#for entry in entries}
            <div class="entry" data-id="{entry.id}">
                <h3>{entry.title}</h3>
                <p>{entry.content}</p>
                <div class="entry-footer">
                    <small class="timestamp">{entry.createdAt.format('yyyy-MM-dd HH:mm')}</small>
                    <form action="/entries/{entry.id}" method="post">
                        <input type="hidden" name="_method" value="DELETE">
                        <button type="submit" class="delete-btn">Delete</button>
                    </form>
                </div>
            </div>
            {/for}
        </div>
    </div>

    <div class="sidebar">
        <h2>Search Entries</h2>
        <div class="search-container">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search your journal...">
                <button type="button" id="search-button" class="search-btn">🔍</button>
            </div>
            <div id="search-results" class="search-results">
                <!-- Search results will appear here -->
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Theme toggle functionality
        const themeToggle = document.getElementById('theme-toggle');

        // Check for saved theme preference
        const savedTheme = localStorage.getItem('journal-theme');
        if (savedTheme) {
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeToggle.checked = savedTheme === 'dark';
        }

        // Theme toggle event listener
        themeToggle.addEventListener('change', () => {
            if (themeToggle.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('journal-theme', 'dark');
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('journal-theme', 'light');
            }
        });

        // Search functionality
        const searchInput = document.getElementById('search-input');
        const searchButton = document.getElementById('search-button');
        const searchResults = document.getElementById('search-results');

        // Search function
        function performSearch() {
            const searchTerm = searchInput.value.trim().toLowerCase();

            if (searchTerm === '') {
                searchResults.innerHTML = '';
                return;
            }

            fetch('/entries/search?keyword=' + searchTerm)
                .then(response => response.json())
                .then(data => {
                    const resultsContainer = document.getElementById('search-results');
                    resultsContainer.innerHTML = '';

                    if (data.length === 0) {
                        resultsContainer.innerHTML = '<p>No matching entries found.</p>';
                        return;
                    }

                    data.forEach(entry => {
                        const entryDiv = document.createElement('div');
                        entryDiv.classList.add('search-result-item');
                        entryDiv.innerHTML =
                            '<h4>' + entry.title + '</h4>' +
                            '<p>' + entry.content + '</p>' +
                            '<small>' + new Date(entry.createdAt).toLocaleString() + '</small>'
                            ;
                        resultsContainer.appendChild(entryDiv);
                    });
                })
                .catch(error => {
                    console.error('Search failed:', error);
                });
        }

        // Event listeners
        searchInput.addEventListener('input', performSearch);
        searchButton.addEventListener('click', performSearch);
    });
</script>
</body>

</html>
